# The test suite, on every push and pull request. Until this existed the
# code deployed every 15 minutes was tested only on the owner's machine, and
# the browser and Node parity checks skipped wherever Chromium or Node was
# absent. GitHub's Ubuntu runners ship both (google-chrome, node), so the
# scenario tests run here for real.
#
# Read-only: installs from requirements-dev.txt, runs the smoke check and the
# suite, writes nothing to the league or the cache store.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: gridiron-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install runtime and development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Smoke check (offline, under a minute)
        run: python scripts/ci/smoke.py
      - name: Full suite
        run: python -m pytest -q -rs
